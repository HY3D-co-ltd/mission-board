<style>
:root {
  color-scheme: light;
  --bg: #fff; --surface: #fff; --ink: #20242a; --muted: #56606c; --line: #dce0e4; --soft: #f5f6f7;
  --accent: #24579b; --ok: var(--ink); --ok-soft: var(--soft); --warn: var(--ink); --warn-soft: var(--soft);
  --wait: var(--muted); --wait-soft: var(--soft);
  --font-sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR",
               "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px;
       line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
a { color: var(--accent); text-decoration: none; }
h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; line-height: 1.35; }
h2 { font-size: 16px; font-weight: 600; margin: 28px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile b { display: block; font-size: 24px; font-weight: 700; line-height: 1.2; }
.tile span { font-size: 13px; color: var(--muted); }
.tile.ok b { color: var(--ok); } .tile.wait b { color: var(--wait); } .tile.warn b { color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
a.card { display: block; color: inherit; }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.name { font-weight: 600; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--soft);
        color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.wait { background: var(--wait-soft); color: var(--wait); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.bar { height: 6px; background: var(--soft); border-radius: 999px; margin-top: 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list li:last-child { padding-bottom: 0; }
.fb { border-left: 4px solid var(--line); }
.fb.ok { border-left-color: var(--ok); } .fb.again { border-left-color: var(--warn); }
.md p { margin: 6px 0; } .md ul { margin: 6px 0; padding-left: 20px; }
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px 0; }
.tbl table { border-collapse: collapse; min-width: 100%; font-size: 14px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.tbl th { background: var(--soft); font-weight: 600; white-space: nowrap; }
dl.profile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; }
dl.profile dt { color: var(--muted); font-size: 13px; padding-top: 1px; white-space: nowrap; }
dl.profile dd { margin: 0; }
details.warns summary { cursor: pointer; font-weight: 600; }
details.warns .list { margin-top: 10px; }
.notice { background: var(--wait-soft); color: var(--wait); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
.back { display: inline-block; margin-bottom: 12px; font-size: 14px; }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
body { font-size: 16px; }
main { max-width: 1060px; padding: 24px 30px 60px; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.035em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
.small, .chip, .tile span, dl.profile dt { font-size: .875rem; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; }
button, .button { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 10px 15px; cursor: pointer; display: inline-block; font-weight: 500; }
button:hover, .button:hover { border-color: var(--accent); text-decoration: none; }
button.primary, .button.primary { background: var(--accent); color: white; border-color: var(--accent); }
button:disabled { cursor: not-allowed; opacity: .65; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.site-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1.2rem; border-bottom: 1px solid var(--line); padding: 0 0 12px; margin-bottom: 32px; }
.site-header .brand { color: var(--ink); font-weight: 700; font-size: 1.15rem; }
.topnav { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.topnav a { color: var(--muted); padding: 6px 0; font-size: .95rem; }
.topnav a[aria-current="page"] { color: var(--accent); text-decoration: underline; text-underline-offset: 5px; }
.hero { padding: 8px 0 24px; margin: 16px 0; border-bottom: 1px solid var(--line); }
.eyebrow { color: var(--accent); font-weight: 600; font-size: .875rem; margin: 0 0 8px; }
.hero p { max-width: 700px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.course-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 32px; margin: 22px 0; }
.course-grid .card { margin: 0; padding: 12px 0; border: 0; border-radius: 0; }
.course-grid h3 { margin: 0 0 10px; }
.course-grid a { display: block; padding: 10px 0; border-top: 1px solid var(--line); }
.lesson-layout { display: grid; grid-template-columns: 195px minmax(0, 1fr); gap: clamp(24px, 5vw, 72px); align-items: start; }
.lesson-nav { position: sticky; top: 20px; max-height: 90vh; overflow-y: auto; padding-right: 10px; }
.lesson-nav h3 { color: var(--muted); font-size: .875rem; margin: 20px 0 6px; }
.lesson-nav a { display: block; padding: 9px 12px; border-radius: 7px; font-size: .9rem; }
.lesson-nav a { color: var(--muted); }
.lesson-nav a[aria-current="page"] { font-weight: 600; color: var(--accent); border-left: 2px solid var(--accent); border-radius: 0; }
.lesson-nav summary { font-weight: 600; cursor: pointer; }
.lesson-body { min-width: 0; }
.lesson-body > header { margin-bottom: 24px; }
.lesson-body .card { padding: .6rem 0; border: 0; border-radius: 0; }
.lesson-body h2 { margin-top: 30px; }
.lesson-body li { margin: 8px 0; }
.lesson-text { padding: 14px 0; border-top: 1px solid var(--line); line-height: 1.85; }
.lesson-text h1 { font-size: 1.4rem; }
.lesson-text h2 { font-size: 1.2rem; }
.lesson-text h3 { font-size: 1.1rem; margin-top: 30px; }
.lesson-text blockquote { border-left: 3px solid var(--accent); margin: 18px 0; padding-left: 16px; color: var(--muted); }
.lesson-text table { border-collapse: collapse; display: block; overflow: auto; font-size: .9rem; }
.lesson-text td, .lesson-text th { border: 1px solid var(--line); padding: 10px; min-width: 100px; text-align: left; }
.lesson-text th { background: var(--soft); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); padding: 18px; border-radius: 8px; font-size: .9rem; line-height: 1.7; }
code { font-family: ui-monospace, "Malgun Gothic", monospace; }
.reference-text { font-family: inherit; }
.stage-track { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin-top: 24px; }
.stage-track li { background: var(--soft); color: var(--muted); padding: 6px 12px; border-radius: 8px; }
.stage-track li.active { background: var(--accent); color: var(--surface); font-weight: 600; }
.card-task { margin-bottom: 8px; }
.card-cta { color: var(--accent); font-weight: 600; }
.mission-card { margin-top: 16px; padding: 24px; }
.mission-card h3 { font-size: 1.15rem; margin: 0 0 12px; }
.mission-card h4, .fb h3 { font-size: 1rem; margin: 24px 0 8px; }
.mission-text { line-height: 1.85; }
.mission-text table { display: block; overflow-x: auto; border-collapse: collapse; }
.mission-text td, .mission-text th { border: 1px solid var(--line); padding: 8px; }
.mission-text ol, .mission-text ul { padding-left: 24px; }
.mission-text li { margin: 8px 0; }
.submission-help { margin: 24px 0; padding: 18px; border: 1px solid var(--line); border-radius: 10px; }
.submission-help h3 { margin-top: 0; }
.copy-row { display: flex; justify-content: flex-end; margin: 8px 0; }
.copy-example { margin: 20px 0; padding: 16px; border: 1px solid var(--accent); border-radius: 10px; }
.copy-example .copy-target { margin: 0 0 10px; color: var(--accent); }
.copy-example pre { margin: 0; }
.copy-example .small { margin-bottom: 0; }
.checklist { list-style: none; padding: 0; }
.checklist label { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.checklist input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); margin-top: 3px; }
.next-lesson { margin-top: 26px; padding-top: 6px; border-top: 1px solid var(--line); }
.lesson-mission { padding: .8rem 0; }
.lesson-mission details { margin-top: .45rem; }
.lesson-steps { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: 1rem; }
.lesson-steps a { display: inline-flex; align-items: center; padding: .25rem 0; }
.lesson-steps a + a::before { content: "›"; padding: 0 .55rem 0 .25rem; color: var(--muted); }
.team-summary { border-top: 1px solid var(--line); padding: 1rem 0; }
.team-summary > summary, .lesson-resources > summary, .lesson-mission summary { cursor: pointer; }
.lesson-resources { margin-top: 1.5rem; }
.tile, .card, .notice, .chip, .button, button, pre { border-radius: 5px; }
.tile { border: 0; border-bottom: 1px solid var(--line); }
.status-message { min-height: 24px; color: var(--muted); font-size: .9rem; }
.status-message:not(:empty) { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); padding: 14px 18px; color: var(--ink); background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 4px 20px #0002; z-index: 10; }
@media(max-width: 700px) {
  main { padding: 16px 16px 40px; }
  .site-header { display: block; margin-bottom: 20px; }
  .topnav { gap: 4px 14px; margin-top: 5px; }
  .topnav a { padding: 5px 0; }
  .lesson-body .card, .lesson-text { padding: 12px 0; }
  .course-grid, .lesson-layout { grid-template-columns: 1fr; }
  .lesson-nav { position: static; max-height: none; padding: 0; }
  .lesson-nav details { border-bottom: 1px solid var(--line); padding: 0 0 9px; }
  .lesson-nav details[open] { max-height: 55vh; overflow: auto; }
}

.native-submission {
  margin: 1.25rem 0;
  padding: 1rem 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  overflow-wrap: anywhere;
}
.native-submission > h3 { margin: 0; }
.native-submission label { display: block; font-weight: 600; }
.native-submission select {
  display: block;
  margin-top: .4rem;
  width: 100%;
  max-width: 40rem;
  padding: .65rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.native-steps { padding-left: 1.6rem; }
.native-steps > li { margin: 1.2rem 0; padding-left: .2rem; }
.native-steps > li::marker { font-weight: 700; color: var(--accent); }
.native-steps p { margin: .45rem 0 .75rem; }
.native-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.native-submission details { margin: .85rem 0; }
.native-submission summary { cursor: pointer; }
.native-submission [role="status"]:empty { display: none; }

</style>

<script>
// 정적 게시판은 미션별 이동 경로만 제공한다. 파일 저장·댓글 작성은 GitHub가 처리한다.
window.BoardSubmissions = (function () {
  "use strict";
  var repository = "https://github.com/HY3D-co-ltd/mission-loop";

  function element(tag, text) {
    var node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function link(url, title) {
    var node = element("a", title);
    node.className = "button";
    node.href = url;
    node.target = "_blank";
    node.rel = "noopener noreferrer";
    return node;
  }

  function instruction(list, title, body) {
    var item = element("li");
    item.append(element("strong", title), element("p", body));
    list.append(item);
    return item;
  }

  function copyButton(title, sample, details, status, message) {
    var button = element("button", title);
    button.type = "button";
    button.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(sample.textContent);
        status.textContent = message;
      } catch (_) {
        details.open = true;
        status.textContent = "자동 복사가 제한되어 있습니다. 펼쳐진 문장을 선택해 복사하세요.";
      }
    });
    return button;
  }

  function agentSubmission(issue, number) {
    var section = element("div");
    var details = element("details");
    var rules = repository + "/blob/main/" + ["문서", "직원-에이전트-제출규칙.md"].map(encodeURIComponent).join("/");
    section.append(element("p", "Orca에서 이번 미션의 실습 폴더를 여세요. 아래 요청문을 복사해 Claude Code 또는 Codex 채팅 입력란에 붙이고, [내 PC의 제출용 폴더 경로]를 실제 경로로 바꿔 보내세요. 에이전트가 제출 규칙을 읽고 내 GitHub 계정으로 결과를 저장합니다."));
    section.append(element("p", "제출 전, 결과물 · 이번 과제의 실제 대화 기록 · 검증 기록 세 가지가 준비됐는지 확인하세요."));
    var sample = element("pre", [
      "내 미션은 #" + number + " " + issue + " 이야.",
      "먼저 비공개 저장소의 직원 제출 규칙을 읽어 줘. " + rules,
      "이번에 올려도 되는 범위는 [내 PC의 제출용 폴더 경로] 안의 이 과제 결과물·검증·실제 작업 기록이야.",
      "내 연습 폴더에 학습진행.md가 있으면 먼저 읽고 지난 단계에서 이어 줘. 중단하거나 마치자고 하면 마지막으로 확인한 단계와 다음에 할 일 하나를 그 파일에 기록해 줘. 제출 회차에는 공유할 사본을 함께 넣어 줘. 개인 연습 기록과 공식 제출 댓글·AI 교육 팀장의 평가는 구분해 줘.",
      "현재 GitHub 로그인 아이디와 이 미션의 내 계정 등록·쓰기 권한을 먼저 확인해 줘. 공유 Google·Claude 로그인이나 화면에서 고른 이름으로 추정하지 말고, 다른 직원이나 AI 교육 팀장 계정으로 대신 제출하지 마.",
      "세션마다 내가 실제로 보낸 요청, 화면에 표시된 AI 답변, 실행 결과, 막힌 부분과 수정·재검증 과정을 처음부터 시간순으로 저장해 줘. 과제 대화를 내보낼 수 있으면 그 원본을 사용하고, 내보내기 기능이 없으면 화면의 실제 대화를 직접 복사할 수 있도록 도와줘. 확인할 수 없는 부분은 위치와 ‘누락’ 사유를 표시하고 기억으로 채우지 마.",
      "이 과제의 원본은 내 PC의 허용된 업무 폴더에 보관해 줘. 제출용 사본에는 비밀번호·토큰·개인정보를 가리고 가린 곳을 표시해 줘. 공유 계정에 있는 다른 사람의 대화와 과제 밖 자료는 수집하지 말고, 화면에 표시되지 않은 숨긴 추론도 제외해 줘.",
      "제출할 회차 폴더 안에 대화기록/세션-01.txt부터 세션별로 가린 사본을 저장해 줘. 결과물, 대화 기록, 검증 기록을 함께 확인하고 원본과 이전 회차는 보존해 줘.",
      "규칙에 따라 제출물/mission-" + number + "의 새 회차 폴더에 실제 파일과 하위 경로를 저장해 줘. 원격 GitHub에서 저장된 커밋 해시와 파일 내용을 다시 확인하고, 위 미션에 내 GitHub 계정으로 결과 링크·검증·도움받은 부분을 댓글로 남겨 줘.",
      "내 댓글도 다시 열어 작성자를 확인해 줘. 커밋 해시와 링크, 확인한 파일 링크, 제출 댓글 링크를 알려 줘. 권한이나 기록이 없으면 막힌 곳을 알려 주고, 없던 파일·대화·제출·판정을 만들지 마."
    ].join("\n"));
    var status = element("p");

window.BoardProgress = (function () {
  "use strict";

  function create(storage, course) {
    var keyPrefix = "mission-loop-progress-v2:";
    var oldKey = "mission-loop-reading-v1";
    var memory = new Map(), dirty = new Set(), anchors = new Map(), checks = new Set();
    var persistent = Boolean(storage);
    course.lessons.forEach(function (lesson) {
      var document = course.documents[lesson.path];
      if (!document) return;
      var valid = new Set(["lesson-body", "practice", "practice-check", "practice-submit", "lesson-feedback"]);
      document.headings.forEach(function (item) { valid.add(item.anchor); });
      anchors.set(lesson.path, valid);
      lesson.checks.forEach(function (_, index) { checks.add(lesson.path + ":" + index); });
    });

    function key(person) {
      return keyPrefix + (person ? "person:" + encodeURIComponent(person) : "guest");
    }
    function pixels(value) {
      return Number.isFinite(value) ? Math.max(0, Math.round(value)) : 0;
    }
    function clean(value) {
      var result = {checks: {}, last: null, updatedAt: 0};
      if (!value || typeof value !== "object") return result;
      checks.forEach(function (name) {
        if (value.checks && value.checks[name] === true) result.checks[name] = true;
      });
      var last = value.last;
      if (last && anchors.has(last.doc)) {
        result.last = {doc: last.doc, anchor: anchors.get(last.doc).has(last.anchor) ? last.anchor : "", scroll: pixels(last.scroll)};
      }
      if (Number.isFinite(value.updatedAt) && value.updatedAt >= 0) result.updatedAt = value.updatedAt;
      return result;
    }
    function parse(raw) {
      try { return JSON.parse(raw); } catch (_) { return null; }
    }
    function get(person) {
      var slot = key(person);
      if (storage && !dirty.has(slot)) {
        try {
          var raw = storage.getItem(slot);
          // 소유자가 없던 예전 기록은 이름 선택 전의 공용 화면에서만 이어 읽는다.
          var record = raw === null && !person ? {checks: parse(storage.getItem(oldKey))} : parse(raw);
          memory.set(slot, clean(record));
        } catch (_) { persistent = false; }
      }
      return clean(memory.get(slot));
    }
    function save(person, state) {
      var slot = key(person);
      state.updatedAt = Date.now();
      memory.set(slot, state);
      try {
        if (storage) {
          storage.setItem(slot, JSON.stringify(state));
          dirty.delete(slot);
          persistent = dirty.size === 0;
          return true;
        }
      } catch (_) { /* 탭의 메모리에 남겨 다음 변경에서 재시도한다. */ }
      persistent = false;
      dirty.add(slot);
      return false;
    }
    function setCheck(person, name, checked) {
      if (!checks.has(name)) return false;
      var state = get(person);
      if (checked) state.checks[name] = true;
      else delete state.checks[name];
      return save(person, state);
    }
    function visit(person, doc, anchor) {
      if (!anchors.has(doc)) return false;
      var state = get(person);
      anchor = anchors.get(doc).has(anchor) ? anchor : "";
      if (state.last && state.last.doc === doc && state.last.anchor === anchor) return persistent;
      state.last = {doc: doc, anchor: anchor, scroll: 0};
      return save(person, state);
    }
    function position(person, doc, scroll) {
      if (!Number.isFinite(scroll)) return false;
      var state = get(person);
      if (!state.last || state.last.doc !== doc) return false;
      var next = pixels(scroll);
      if (state.last.scroll === next) return persistent;
      state.last.scroll = next;
      return save(person, state);
    }
    function clear(person) {
      var slot = key(person);
      memory.delete(slot);
      try {
        if (storage) {
          if (!person) storage.removeItem(oldKey);
          storage.removeItem(slot);
          dirty.delete(slot);
          persistent = dirty.size === 0;
          return true;
        }
      } catch (_) { /* 삭제가 실패해도 현재 탭의 화면에서는 비운다. */ }
      dirty.add(slot);
      persistent = false;
      return false;
    }
    function track(view) {
      var page = null, timer = null;
      function flush() {
        clearTimeout(timer);
        timer = null;
        if (page) position(page.person, page.doc, view.scrollY);
      }
      function leave() {
        flush();
        page = null;
      }
      function enter(person, doc, anchor) {
        clearTimeout(timer);
        page = null;
        if (!anchors.has(doc)) return;
        visit(person, doc, anchor);
        page = {person: person, doc: doc};
      }
      view.addEventListener("scroll", function () {
        if (!page) return;
        var current = page;
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (current === page) flush();
        }, 500);
      }, {passive: true});
      view.addEventListener("pagehide", flush);
      return {enter: enter, leave: leave, flush: flush};
    }
    return {get: get, setCheck: setCheck, visit: visit, position: position, clear: clear, track: track,
      get persistent() { return persistent; }};
  }
  return {create: create};
})();

    app.innerHTML = nav(who ? 'person' : view === 'login' ? 'choose' : view) + (who ? person(who) : view === 'choose' || view === 'login' ? personPicker() : view === 'classroom' ? (doc ? lesson(doc) : classroom()) : view === 'submit' ? submission() : view === 'improvements' ? improvements() : home()) + '<p id="action-status" class="status-message" role="status" aria-live="polite"></p>';
    if (app.querySelectorAll) window.BoardSubmissions.mountAll(app, D.people, params.get('mission') || (selectedPerson() && selectedPerson().open[0] ? String(selectedPerson().open[0].number) : ''));
    var anchor = params.get('anchor');
    if (anchor) {
      var target = document.getElementById('heading-' + anchor);
      if (target && target.scrollIntoView) {
        for (var node = target.parentElement; node; node = node.parentElement) if (node.tagName === 'DETAILS') node.open = true;
        target.scrollIntoView();
      }
    }
    if (progress && view === 'classroom' && doc && !who) {
      var savedPosition = progress.get(selectedId).last;
      if (params.get('resume') === '1' && savedPosition && savedPosition.doc === doc) window.scrollTo(0, savedPosition.scroll);
      progressTracker.enter(selectedId, doc, anchor);
    }
  }
  function fail(code) {
    var msg = {
      nokey: "링크에 열쇠가 빠져 있습니다. 카카오톡으로 받은 링크 전체로 다시 열어 주세요.",
      nocrypto: "이 브라우저에서는 열 수 없습니다. 크롬이나 사파리로 열어 주세요."
    }[code] || "링크가 올바르지 않거나 바뀌었습니다. 가장 최근에 받은 링크로 다시 열어 주세요.";
    app.innerHTML = "<h1>미션 현황</h1><p>" + esc(msg) + "</p>";
  }

  window.addEventListener("hashchange", function () { if (progressTracker) progressTracker.leave(); window.scrollTo(0, 0); render(); });
  unlock().then(function (data) {
    D = data; document.title = data.title;
    try { selectedId = localStorage.getItem(PERSON_KEY) || ''; if (!selectedPerson()) selectedId = ''; } catch (_) { storageOK = false; }
    var progressStorage = null;
    try { progressStorage = localStorage; } catch (_) { storageOK = false; }
    progress = window.BoardProgress.create(progressStorage, D.course);
    progressTracker = progress.track(window);
    reading = progress.get(selectedId).checks;
    render();
  })
    .catch(function (e) { fail(e && e.message); });
})();
